name: Phase 3 verification diagnostics

on:
  push:
    branches:
      - phase-3-fleet-consolidation

concurrency:
  group: phase-3-integrations
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-fleet-consolidation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run and report each verification stage
        run: |
          set +e
          report_failure() {
            stage="$1"
            log="$2"
            {
              echo "### Phase 3 verification failed: $stage"
              echo
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            } > /tmp/phase3-comment.md
            gh pr comment 5 --body-file /tmp/phase3-comment.md
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase3_integrations_apply.py')
          text = path.read_text().replace('{v.registration_number}', '{v.license_plate}')
          path.write_text(text)
          PY

          python3 scripts/phase3_integrations_apply.py > /tmp/apply.log 2>&1
          [ "$?" -eq 0 ] || report_failure "guarded source patch" /tmp/apply.log

          bun install --frozen-lockfile > /tmp/install.log 2>&1
          [ "$?" -eq 0 ] || report_failure "dependency installation" /tmp/install.log

          FILES=(
            'src/components/AdminShell.tsx'
            'src/components/profile/DriverProfileSections.tsx'
            'src/components/support/AdminSupportVehicleActions.tsx'
            'src/lib/fleet.ts'
            'src/lib/fleet.test.ts'
            'src/lib/support.ts'
            'src/lib/vehicle-suitability.ts'
            'src/lib/vehicle-suitability.test.ts'
            'src/routes/app.admin.fleet.tsx'
            'src/routes/app.admin.vehicle-profiles.tsx'
            'src/routes/app.admin.vehicle-profiles.$vehicleId.tsx'
            'src/routes/app.admin.maintenance.tsx'
            'src/routes/app.admin.driver-assignments.tsx'
            'src/routes/app.admin.support.$ticketId.tsx'
            'src/routes/app.admin.bookings.tsx'
            'src/routes/app.admin.trips.tsx'
            'src/routes/app.passenger.bookings.tsx'
          )

          bunx prettier --write "${FILES[@]}" > /tmp/prettier.log 2>&1
          [ "$?" -eq 0 ] || report_failure "formatting" /tmp/prettier.log

          bunx eslint --fix "${FILES[@]}" > /tmp/lint-fix.log 2>&1
          [ "$?" -eq 0 ] || report_failure "safe lint formatting" /tmp/lint-fix.log

          bunx eslint "${FILES[@]}" > /tmp/lint.log 2>&1
          [ "$?" -eq 0 ] || report_failure "scoped lint" /tmp/lint.log

          bun run test > /tmp/test.log 2>&1
          [ "$?" -eq 0 ] || report_failure "full test suite" /tmp/test.log

          bun run build > /tmp/build.log 2>&1
          [ "$?" -eq 0 ] || report_failure "production build" /tmp/build.log

          gh pr comment 5 --body 'Phase 3 diagnostic verification passed every stage. The branch is ready for the verified integration commit run.'
