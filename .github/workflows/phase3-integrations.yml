name: Phase 3 integration diagnostics

on:
  push:
    branches:
      - phase-3-fleet-consolidation

concurrency:
  group: phase-3-integrations
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-fleet-consolidation
          fetch-depth: 0

      - name: Apply patch and report exact result
        run: |
          set +e
          python3 scripts/phase3_integrations_apply.py > phase3-integration-diagnostic.log 2>&1
          code=$?
          cat phase3-integration-diagnostic.log
          {
            if [ "$code" -eq 0 ]; then
              echo '### Phase 3 integration patch matched successfully'
            else
              echo '### Phase 3 integration patch stopped safely'
            fi
            echo
            echo '```text'
            cat phase3-integration-diagnostic.log
            echo '```'
          } > /tmp/phase3-comment.md
          gh pr comment 5 --body-file /tmp/phase3-comment.md
          exit "$code"
