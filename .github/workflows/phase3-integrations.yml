name: Phase 3 verified integration commit

on:
  push:
    branches:
      - phase-3-fleet-consolidation

concurrency:
  group: phase-3-integrations
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-fleet-consolidation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply guarded integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase3_integrations_apply.py')
          text = path.read_text().replace('{v.registration_number}', '{v.license_plate}')
          path.write_text(text)
          PY
          python3 scripts/phase3_integrations_apply.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint Phase 3 source
        run: |
          FILES=(
            'src/components/AdminShell.tsx'
            'src/components/profile/DriverProfileSections.tsx'
            'src/components/support/AdminSupportVehicleActions.tsx'
            'src/lib/fleet.ts'
            'src/lib/fleet.test.ts'
            'src/lib/support.ts'
            'src/lib/vehicle-suitability.ts'
            'src/lib/vehicle-suitability.test.ts'
            'src/routes/app.admin.fleet.tsx'
            'src/routes/app.admin.vehicle-profiles.tsx'
            'src/routes/app.admin.vehicle-profiles.$vehicleId.tsx'
            'src/routes/app.admin.maintenance.tsx'
            'src/routes/app.admin.driver-assignments.tsx'
            'src/routes/app.admin.support.$ticketId.tsx'
            'src/routes/app.admin.bookings.tsx'
            'src/routes/app.admin.trips.tsx'
            'src/routes/app.passenger.bookings.tsx'
          )
          bunx prettier --write "${FILES[@]}"
          bunx eslint --fix "${FILES[@]}"
          bunx eslint "${FILES[@]}"

      - name: Run full test suite
        run: bun run test

      - name: Run production build
        run: bun run build

      - name: Commit verified integrations
        run: |
          rm -f scripts/phase3_integrations_apply.py .github/workflows/phase3-integrations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(fleet): integrate canonical fleet operations"
          git pull --rebase origin phase-3-fleet-consolidation
          git push origin HEAD:phase-3-fleet-consolidation
          gh pr comment 5 --body 'Phase 3 integrations are committed. Scoped lint, the full test suite, and the production build passed before the verified commit was pushed.'

      - name: Report failure
        if: failure()
        run: gh pr comment 5 --body 'The final Phase 3 integration commit job stopped before push. No partial integration commit was created.'
