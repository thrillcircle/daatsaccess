name: Phase 2 closeout corrections

on:
  push:
    branches:
      - phase-2-closeout-corrections

concurrency:
  group: phase-2-closeout-corrections
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-closeout-corrections
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Align driver profile patch guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/phase2_closeout_apply.py')
          text = path.read_text()
          start_marker = '''replace_once(
              driver_profile,
              ''' + "'''" + '''        <p className="mt-4 flex items-start gap-2 rounded-xl bg-secondary p-3 text-xs text-muted-foreground">'''
          start = text.index(start_marker)
          end = text.index('\n\n# Refresh the generated Supabase types', start)
          replacement = '''driver_file = Path(driver_profile)
          driver_text = driver_file.read_text()
          driver_notice = ''' + '"""' + '''          through Support but cannot edit vehicle master data or maintenance status.
                  </p>
          ''' + '"""' + '''
          if driver_notice not in driver_text:
              raise RuntimeError("Driver support notice marker was not found")
          driver_button = driver_notice + ''' + '"""' + '''        <Button asChild variant="outline" className="mt-3 w-full">
                    <Link
                      to="/app/support"
                      search={{
                        rideId: "",
                        bookingId: "",
                        category: "vehicle_issue",
                        subject: driver?.license_plate
                          ? `Vehicle issue · ${driver.license_plate}`
                          : "Vehicle or driver operations issue",
                      }}
                    >
                      <LifeBuoy className="mr-1 h-4 w-4" /> Report a vehicle or operational issue
                    </Link>
                  </Button>
          ''' + '"""' + '''
          driver_file.write_text(driver_text.replace(driver_notice, driver_button, 1))'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Apply closeout patch
        run: |
          set +e
          python3 scripts/phase2_closeout_apply.py > phase2-closeout-apply.log 2>&1
          code=$?
          cat phase2-closeout-apply.log
          echo "APPLY_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Report and persist patch diagnostics
        if: env.APPLY_EXIT != '0'
        run: |
          {
            echo '### Phase 2 closeout patch stopped safely'
            echo
            echo '```text'
            cat phase2-closeout-apply.log
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment 4 --body-file /tmp/pr-comment.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-closeout-apply.log
          git commit -m "chore(closeout): record patch diagnostic"
          git pull --rebase origin phase-2-closeout-corrections
          git push origin HEAD:phase-2-closeout-corrections
          exit 1

      - name: Install dependencies
        if: env.APPLY_EXIT == '0'
        run: bun install --frozen-lockfile

      - name: Format changed source
        if: env.APPLY_EXIT == '0'
        run: |
          bunx prettier --write \
            'src/components/AddressAutocomplete.tsx' \
            'src/components/profile/DriverProfileSections.tsx' \
            'src/components/profile/PassengerProfileSections.tsx' \
            'src/components/support/AdminCreateSupportTicketDialog.tsx' \
            'src/integrations/supabase/types.ts' \
            'src/lib/vehicle-suitability.ts' \
            'src/lib/vehicle-suitability.test.ts' \
            'src/routes/app.admin.passengers.tsx' \
            'src/routes/app.admin.passengers.$passengerId.tsx' \
            'src/routes/app.admin.pricing-services.tsx' \
            'src/routes/app.admin.support.tsx' \
            'src/routes/app.admin.support.$ticketId.tsx' \
            'src/routes/app.passenger.bookings.tsx' \
            'src/routes/app.support.tsx' \
            'src/routes/app.support.$ticketId.tsx' \
            'src/routes/app.trip.$rideId.tsx'

      - name: Lint changed source
        if: env.APPLY_EXIT == '0'
        run: |
          bunx eslint \
            'src/components/AddressAutocomplete.tsx' \
            'src/components/profile/DriverProfileSections.tsx' \
            'src/components/profile/PassengerProfileSections.tsx' \
            'src/components/support/AdminCreateSupportTicketDialog.tsx' \
            'src/integrations/supabase/types.ts' \
            'src/lib/vehicle-suitability.ts' \
            'src/lib/vehicle-suitability.test.ts' \
            'src/routes/app.admin.passengers.tsx' \
            'src/routes/app.admin.passengers.$passengerId.tsx' \
            'src/routes/app.admin.pricing-services.tsx' \
            'src/routes/app.admin.support.tsx' \
            'src/routes/app.admin.support.$ticketId.tsx' \
            'src/routes/app.passenger.bookings.tsx' \
            'src/routes/app.support.tsx' \
            'src/routes/app.support.$ticketId.tsx' \
            'src/routes/app.trip.$rideId.tsx'

      - name: Run full test suite
        if: env.APPLY_EXIT == '0'
        run: bun run test

      - name: Run production build
        if: env.APPLY_EXIT == '0'
        run: bun run build

      - name: Commit verified corrections
        if: env.APPLY_EXIT == '0'
        run: |
          rm -f scripts/phase2_closeout_apply.py .github/workflows/phase2-closeout-apply.yml phase2-closeout-apply.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase scripts .github phase2-closeout-apply.log
          git commit -m "fix(operations): close Phase 2 support and fleet gaps"
          git pull --rebase origin phase-2-closeout-corrections
          git push origin HEAD:phase-2-closeout-corrections
          gh pr comment 4 --body 'Phase 2 closeout patch applied. Scoped lint, full tests, and production build passed before the verified correction commit was pushed.'
