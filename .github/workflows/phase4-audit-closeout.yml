name: Phase 4 Audit Closeout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'phase-4-pricing-quotations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-pricing-quotations
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply guarded audit closeout
        run: python scripts/phase4_apply_audit_closeout.py

      - name: Remove temporary tooling
        run: rm scripts/phase4_apply_audit_closeout.py .github/workflows/phase4-audit-closeout.yml

      - name: Format audited TypeScript
        run: |
          bunx prettier --write \
            src/lib/pricing-api.ts \
            src/lib/pricing-migrations.test.ts \
            src/components/pricing/PricingVersionManager.tsx \
            'src/routes/app.admin.bookings.$bookingId.quote.tsx' \
            src/components/NotificationBell.tsx \
            src/routes/app.passenger.book.assisted.tsx \
            src/routes/app.passenger.book.appointment.tsx

      - name: Lint audited TypeScript
        run: |
          bunx eslint \
            src/lib/pricing-api.ts \
            src/lib/pricing-migrations.test.ts \
            src/components/pricing/PricingVersionManager.tsx \
            'src/routes/app.admin.bookings.$bookingId.quote.tsx' \
            src/components/NotificationBell.tsx \
            src/routes/app.passenger.book.assisted.tsx \
            src/routes/app.passenger.book.appointment.tsx

      - name: Audit prohibited client pricing paths
        run: |
          if grep -R --line-number --include='*.ts' --include='*.tsx' \
            -E '\.from\("service_quotes"\)|\.from\("service_quote_items"\)' src; then
            echo 'Direct quote-table access remains' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.tsx' \
            -E 'estimatePrice\(' src/routes/app.passenger.book.assisted.tsx src/routes/app.passenger.book.appointment.tsx; then
            echo 'Mock specialised pricing is still presented as a browser estimate' >&2
            exit 1
          fi

      - name: Run full test suite
        run: bun test

      - name: Run production build
        run: bun run build

      - name: Commit verified audit closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No closeout changes to commit'
          else
            git commit -m 'fix(pricing): close Phase 4 security and state gaps'
            git push origin HEAD:phase-4-pricing-quotations
          fi
