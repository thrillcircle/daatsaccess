name: Phase 5 Integrity Closeout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'phase-5-final-dispatch-onboarding-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-final-dispatch-onboarding-closeout
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply scoped closeout
        run: python3 .github/scripts/phase5_integrity_closeout.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format closeout TypeScript
        run: |
          bunx prettier --write \
            src/lib/ride-driver.functions.ts \
            src/lib/driver-rides.ts \
            src/components/driver/DriverActiveRide.tsx \
            src/integrations/supabase/types.ts \
            src/lib/phase5-dispatch-cancellation-integrity.test.ts

      - name: Verify legacy paths are absent
        shell: bash
        run: |
          ! rg -n "driver_accept_ride|acceptRide|driver_cancel_ride|cancelDriverRide" \
            src --glob '!**/*.test.ts' --glob '!**/__tests__/**'
          rg -n "driver_accept_dispatch_offer" src/components/operations/DriverOperationsPanel.tsx
          ! rg -n '>\s*Cancel\s*<' src/components/driver/DriverActiveRide.tsx

      - name: Lint changed TypeScript
        run: |
          bunx eslint \
            src/lib/ride-driver.functions.ts \
            src/lib/driver-rides.ts \
            src/components/driver/DriverActiveRide.tsx \
            src/integrations/supabase/types.ts \
            src/lib/phase5-dispatch-cancellation-integrity.test.ts

      - name: Run full test suite
        run: bun run test

      - name: Run full TypeScript audit
        run: bunx tsc --noEmit

      - name: Run production build
        run: bun run build

      - name: Commit verified product changes
        shell: bash
        run: |
          rm -f .phase5-integrity-trigger
          rm -f .github/scripts/phase5_integrity_closeout.py
          rm -f .github/workflows/phase5-integrity-closeout-pr.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 5: close dispatch and cancellation bypasses"
          git push origin HEAD:phase-5-final-dispatch-onboarding-closeout
