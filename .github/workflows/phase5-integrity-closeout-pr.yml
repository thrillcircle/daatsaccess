name: Phase 5 Integrity Closeout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'phase-5-final-dispatch-onboarding-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-final-dispatch-onboarding-closeout
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply scoped closeout
        run: |
          python3 .github/scripts/phase5_integrity_closeout.py
          python3 <<'PY'
          from pathlib import Path

          panel_path = Path("src/components/operations/DriverOperationsPanel.tsx")
          panel = panel_path.read_text()

          function_anchor = "\n  async function reportIncident() {"
          no_show_function = '''
  async function reportNoShow(run: OperationRun) {
    setBusy(`no-show:${run.id}`);
    const { error } = await operationsDb.rpc("driver_report_no_show", {
      p_run_id: run.id,
      p_expected_run_version: run.row_version,
      p_details: "Passenger did not arrive at the confirmed pickup point.",
    });
    setBusy(null);
    if (error) toast.error(error.message);
    else {
      toast.success("Passenger no-show reported to Operations");
      await load();
    }
  }
'''
          if function_anchor not in panel:
              raise SystemExit("Could not locate the incident operation anchor")
          panel = panel.replace(function_anchor, "\n" + no_show_function + "  async function reportIncident() {", 1)

          # Passenger no-show has a dedicated protected operation and must not
          # fall through the generic incident form.
          panel = panel.replace('                      "passenger_no_show",\n', "", 1)

          actions_anchor = '''                  {assignment.status === "acknowledged"
                    ? actions.map((target) => (
                        <Button
                          key={target}
                          variant={
                            target === "interrupted" || target === "failed"
                              ? "destructive"
                              : "outline"
                          }
                          onClick={() => void transition(run, target)}
                          disabled={busy === `transition:${run.id}`}
                        >
                          {target.replaceAll("_", " ")}
                        </Button>
                      ))
                    : null}'''
          no_show_button = '''
                  {assignment.status === "acknowledged" &&
                  ["driver_arrived", "waiting"].includes(run.operational_status) ? (
                    <Button
                      variant="outline"
                      onClick={() => void reportNoShow(run)}
                      disabled={busy === `no-show:${run.id}`}
                    >
                      <AlertTriangle className="mr-2 h-4 w-4" />
                      Passenger no-show
                    </Button>
                  ) : null}'''
          if actions_anchor not in panel:
              raise SystemExit("Could not locate Driver operation actions")
          panel = panel.replace(actions_anchor, actions_anchor + no_show_button, 1)
          panel_path.write_text(panel)

          test_path = Path("src/lib/phase5-dispatch-cancellation-integrity.test.ts")
          tests = test_path.read_text()
          tests = tests.replace(
              '''      "operation_run_events",
      "notification_outbox",''',
              '''      "private.operations_add_event",
      "private.operations_enqueue_notification",''',
              1,
          )
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format closeout TypeScript
        run: |
          bunx prettier --write \
            src/lib/ride-driver.functions.ts \
            src/lib/driver-rides.ts \
            src/components/driver/DriverActiveRide.tsx \
            src/components/operations/DriverOperationsPanel.tsx \
            src/integrations/supabase/types.ts \
            src/lib/phase5-dispatch-cancellation-integrity.test.ts

      - name: Verify legacy paths are absent
        run: |
          python3 <<'PY'
          from pathlib import Path

          prohibited = (
              "driver_accept_ride",
              "acceptRide",
              "driver_cancel_ride",
              "cancelDriverRide",
          )
          runtime = []
          for path in Path("src").rglob("*"):
              if path.suffix not in {".ts", ".tsx"}:
                  continue
              if path.name.endswith(".test.ts") or "__tests__" in path.parts:
                  continue
              runtime.append((path, path.read_text()))
          failures = [
              f"{path}: {token}"
              for path, text in runtime
              for token in prohibited
              if token in text
          ]
          if failures:
              raise SystemExit("Legacy runtime path remains:\n" + "\n".join(failures))

          panel = Path("src/components/operations/DriverOperationsPanel.tsx").read_text()
          for protected in (
              "driver_accept_dispatch_offer",
              "driver_decline_operation",
              "driver_report_no_show",
              "driver_report_incident",
          ):
              if protected not in panel:
                  raise SystemExit(f"Protected Driver operation is missing: {protected}")

          active = Path("src/components/driver/DriverActiveRide.tsx").read_text()
          if "onClick={cancel}" in active or ">Cancel<" in active:
              raise SystemExit("Generic Driver cancellation UI remains")
          PY

      - name: Lint changed TypeScript
        run: |
          bunx eslint \
            src/lib/ride-driver.functions.ts \
            src/lib/driver-rides.ts \
            src/components/driver/DriverActiveRide.tsx \
            src/components/operations/DriverOperationsPanel.tsx \
            src/integrations/supabase/types.ts \
            src/lib/phase5-dispatch-cancellation-integrity.test.ts

      - name: Run full test suite
        run: bun run test

      - name: Run full TypeScript audit
        run: bunx tsc --noEmit

      - name: Run production build
        run: bun run build

      - name: Commit verified product changes
        shell: bash
        run: |
          rm -f .phase5-integrity-trigger
          rm -f .github/scripts/phase5_integrity_closeout.py
          rm -f .github/workflows/phase5-integrity-closeout-pr.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 5: close dispatch and cancellation bypasses"
          git push origin HEAD:phase-5-final-dispatch-onboarding-closeout
