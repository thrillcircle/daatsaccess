name: Phase 5 Generated Cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.event.pull_request.head.ref == 'phase-5-final-dispatch-onboarding-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-final-dispatch-onboarding-closeout
          fetch-depth: 0

      - name: Restore generated files from main
        run: |
          git checkout origin/main -- src/integrations/supabase/types.ts src/routeTree.gen.ts
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/integrations/supabase/types.ts")
          text = path.read_text()
          text, accept_count = re.subn(
              r'^\s*driver_accept_ride: \{ Args: \{ p_ride_id: string \}; Returns: Json \}\n',
              '',
              text,
              flags=re.M,
          )
          text, cancel_count = re.subn(
              r'^\s*driver_cancel_ride: \{ Args: \{ p_ride_id: string \}; Returns: Json \}\n',
              '',
              text,
              flags=re.M,
          )
          if accept_count != 1 or cancel_count != 1:
              raise SystemExit(
                  f"Expected one generated signature each, got accept={accept_count}, cancel={cancel_count}"
              )
          path.write_text(text)
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full tests
        run: bun run test

      - name: Run full TypeScript audit
        run: bunx tsc --noEmit

      - name: Run production build
        run: bun run build

      - name: Commit clean generated diff
        run: |
          git checkout origin/main -- src/routeTree.gen.ts
          rm .github/workflows/phase5-generated-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 5: minimize generated closeout diff"
          git push origin HEAD:phase-5-final-dispatch-onboarding-closeout
