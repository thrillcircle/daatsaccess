name: Phase 1 implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: phase-1-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-interface-pricing-cleanup
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply final Phase 1 labels
        run: python3 scripts/phase1_final_labels.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed source files
        run: |
          bunx prettier --write \
            src/routes/app.passenger.index.tsx \
            src/routes/app.passenger.book.index.tsx \
            src/routes/app.passenger.bookings.tsx

      - name: Lint Phase 1 source files
        run: |
          bunx eslint \
            src/components/AppShell.tsx \
            src/components/AdminShell.tsx \
            src/routes/app.driver.tsx \
            src/routes/app.admin.index.tsx \
            src/routes/app.admin.drivers.tsx \
            src/routes/app.admin.passengers.tsx \
            src/routes/app.admin.pricing-services.tsx \
            src/routes/app.passenger.index.tsx \
            src/routes/app.passenger.book.index.tsx \
            src/routes/app.passenger.bookings.tsx

      - name: Test
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Commit verified label cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.passenger.index.tsx src/routes/app.passenger.book.index.tsx src/routes/app.passenger.bookings.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "No label changes to commit."
            exit 0
          fi
          git commit -m "fix(ui): align passenger page labels with phase one navigation"
          git pull --rebase origin phase-1-interface-pricing-cleanup
          git push origin HEAD:phase-1-interface-pricing-cleanup
