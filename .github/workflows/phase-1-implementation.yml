name: Phase 1 implementation

on:
  push:
    branches:
      - phase-1-interface-pricing-cleanup

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-interface-pricing-cleanup
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply Phase 1 patch
        run: python3 scripts/phase1_cleanup.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed source files
        run: |
          bunx prettier --write \
            src/components/AppShell.tsx \
            src/components/AdminShell.tsx \
            src/routes/app.driver.tsx \
            src/routes/app.admin.index.tsx \
            src/routes/app.admin.drivers.tsx \
            src/routes/app.admin.passengers.tsx \
            src/routes/app.admin.pricing-services.tsx \
            supabase/migrations/20260730173000_phase1_service_pricing_rules.sql

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase scripts .github
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat(ui): complete phase one cleanup and pricing foundation"
          git push origin HEAD:phase-1-interface-pricing-cleanup
