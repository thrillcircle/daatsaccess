name: Phase 5 Source Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'phase-5-operations-dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5-source-${{ github.sha }}
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1
