name: Phase 2 verification

on:
  push:
    branches:
      - phase-2-profiles-passengers-support
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: phase-2-verification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-profiles-passengers-support
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply source cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          driver = Path('src/components/profile/DriverProfileSections.tsx')
          text = driver.read_text()
          text = text.replace(
              'import { useEffect, useMemo, useState } from "react";',
              'import { useEffect, useMemo, useState, type ReactNode } from "react";',
          )
          text = text.replace('icon?: React.ReactNode', 'icon?: ReactNode')
          driver.write_text(text)

          bell = Path('src/components/NotificationBell.tsx')
          text = bell.read_text()
          text = text.replace(
              'import { useEffect, useState } from "react";',
              'import { useEffect, useState, type ReactNode } from "react";',
          )
          text = text.replace('let destination: React.ReactNode', 'let destination: ReactNode')
          bell.write_text(text)

          passengers = Path('src/routes/app.admin.passengers.tsx')
          text = passengers.read_text()
          text = text.replace(
              'import { Activity, CalendarRange, Loader2, Phone, Search, UserCircle2 } from "lucide-react";',
              'import { Activity, Loader2, Phone, Search, UserCircle2 } from "lucide-react";',
          )
          text = text.replace('import { Button } from "@/components/ui/button";\n', '')
          passengers.write_text(text)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase 2 source files
        run: |
          bunx prettier --write \
            'src/components/AdminShell.tsx' \
            'src/components/AppShell.tsx' \
            'src/components/AddressAutocomplete.tsx' \
            'src/components/NotificationBell.tsx' \
            'src/components/profile/PersonalProfileCard.tsx' \
            'src/components/profile/PassengerProfileSections.tsx' \
            'src/components/profile/DriverProfileSections.tsx' \
            'src/lib/support.ts' \
            'src/lib/support.test.ts' \
            'src/routes/app.profile.tsx' \
            'src/routes/app.support.tsx' \
            'src/routes/app.support.$ticketId.tsx' \
            'src/routes/app.admin.support.tsx' \
            'src/routes/app.admin.support.$ticketId.tsx' \
            'src/routes/app.admin.passengers.tsx' \
            'src/routes/app.admin.passengers.$passengerId.tsx'

      - name: Lint Phase 2 source files
        run: |
          bunx eslint \
            'src/components/AdminShell.tsx' \
            'src/components/AppShell.tsx' \
            'src/components/AddressAutocomplete.tsx' \
            'src/components/NotificationBell.tsx' \
            'src/components/profile/PersonalProfileCard.tsx' \
            'src/components/profile/PassengerProfileSections.tsx' \
            'src/components/profile/DriverProfileSections.tsx' \
            'src/lib/support.ts' \
            'src/lib/support.test.ts' \
            'src/routes/app.profile.tsx' \
            'src/routes/app.support.tsx' \
            'src/routes/app.support.$ticketId.tsx' \
            'src/routes/app.admin.support.tsx' \
            'src/routes/app.admin.support.$ticketId.tsx' \
            'src/routes/app.admin.passengers.tsx' \
            'src/routes/app.admin.passengers.$passengerId.tsx'

      - name: Run full test suite
        run: bun run test

      - name: Run production build
        run: bun run build

      - name: Commit verified formatting and route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          if git diff --cached --quiet; then
            echo "No generated or formatting changes to commit."
            exit 0
          fi
          git commit -m "chore(phase2): verify formatting and generated routes"
          git pull --rebase origin phase-2-profiles-passengers-support
          git push origin HEAD:phase-2-profiles-passengers-support
