name: Access CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed source files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          BASE_SHA="$BASE_SHA" bun run lint:changed

      - name: Run full test suite
        run: bun run test

      - name: Run production build
        run: bun run build

      - name: Verify generated routes are up to date
        # The route tree is generated by the repository-pinned
        # @tanstack/router-plugin during the Vite build above, so the build
        # output is the source of truth. Do NOT use the unrelated npm `tsr`
        # package here.
        run: git diff --exit-code -- src/routeTree.gen.ts
