name: Access CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-closeout:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-2-closeout-corrections' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-closeout-corrections
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove directly completed driver subsection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/phase2_closeout_apply.py")
          text = path.read_text()
          start = text.index("# Driver vehicle/status Support access.")
          end = text.index("# Refresh the generated Supabase types", start)
          path.write_text(text[:start] + text[end:])
          PY

      - name: Apply Phase 2 closeout patch
        run: python3 scripts/phase2_closeout_apply.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format closeout source
        run: |
          bunx prettier --write \
            'src/components/AddressAutocomplete.tsx' \
            'src/components/profile/DriverProfileSections.tsx' \
            'src/components/profile/PassengerProfileSections.tsx' \
            'src/components/support/AdminCreateSupportTicketDialog.tsx' \
            'src/integrations/supabase/types.ts' \
            'src/lib/vehicle-suitability.ts' \
            'src/lib/vehicle-suitability.test.ts' \
            'src/routes/app.admin.passengers.tsx' \
            'src/routes/app.admin.passengers.$passengerId.tsx' \
            'src/routes/app.admin.pricing-services.tsx' \
            'src/routes/app.admin.support.tsx' \
            'src/routes/app.admin.support.$ticketId.tsx' \
            'src/routes/app.passenger.bookings.tsx' \
            'src/routes/app.support.tsx' \
            'src/routes/app.support.$ticketId.tsx' \
            'src/routes/app.trip.$rideId.tsx'

      - name: Lint closeout source
        run: |
          bunx eslint \
            'src/components/AddressAutocomplete.tsx' \
            'src/components/profile/DriverProfileSections.tsx' \
            'src/components/profile/PassengerProfileSections.tsx' \
            'src/components/support/AdminCreateSupportTicketDialog.tsx' \
            'src/integrations/supabase/types.ts' \
            'src/lib/vehicle-suitability.ts' \
            'src/lib/vehicle-suitability.test.ts' \
            'src/routes/app.admin.passengers.tsx' \
            'src/routes/app.admin.passengers.$passengerId.tsx' \
            'src/routes/app.admin.pricing-services.tsx' \
            'src/routes/app.admin.support.tsx' \
            'src/routes/app.admin.support.$ticketId.tsx' \
            'src/routes/app.passenger.bookings.tsx' \
            'src/routes/app.support.tsx' \
            'src/routes/app.support.$ticketId.tsx' \
            'src/routes/app.trip.$rideId.tsx'

      - name: Run full test suite
        run: bun run test

      - name: Run production build
        run: bun run build

      - name: Commit verified closeout
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/phase2-closeout-apply.yml scripts/phase2_closeout_apply.py phase2-closeout-apply.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase scripts .github phase2-closeout-apply.log
          git commit -m "fix(operations): close Phase 2 support and fleet gaps"
          git pull --rebase origin phase-2-closeout-corrections
          git push origin HEAD:phase-2-closeout-corrections

  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'phase-2-closeout-corrections' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed source files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx' \
            | grep '^src/' \
            | grep -v '^src/routeTree.gen.ts$' \
            > /tmp/changed-source-files.txt || true

          if [ -s /tmp/changed-source-files.txt ]; then
            echo "Linting changed source files:"
            cat /tmp/changed-source-files.txt
            xargs bunx eslint < /tmp/changed-source-files.txt
          else
            echo "No changed TypeScript source files to lint."
          fi

      - name: Run full test suite
        run: bun run test

      - name: Run production build
        run: bun run build
