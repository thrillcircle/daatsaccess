name: Phase 5 Sync Main

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.event.pull_request.head.ref == 'phase-5-final-dispatch-onboarding-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-final-dispatch-onboarding-closeout
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full tests
        run: bun run test

      - name: Run full TypeScript audit
        run: bunx tsc --noEmit

      - name: Run production build
        run: bun run build

      - name: Push synchronized verified branch
        run: |
          rm .github/workflows/phase5-sync-main.yml
          git checkout origin/main -- src/routeTree.gen.ts
          git diff --check
          git add -A
          git commit -m "Phase 5: synchronize closeout with main"
          git push origin HEAD:phase-5-final-dispatch-onboarding-closeout
