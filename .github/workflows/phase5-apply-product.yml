name: Phase 5 Apply Product

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase-5-operations-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-operations-dispatch
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify and apply product payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .phase5-payload/part00
            .phase5-payload/part01
            .phase5-payload/part02
            .phase5-payload/part04
            .phase5-payload/part06
            .phase5-payload/part08a
            .phase5-payload/part09
            .phase5-payload/part10
          )
          cat "${parts[@]}" > /tmp/phase5-product.b64
          echo "1449effaaac7028fe2001eb43a21732e89243c296298f8c53f89d01124f77f18  /tmp/phase5-product.b64" | sha256sum -c -
          base64 -d /tmp/phase5-product.b64 > /tmp/phase5-product.tar.gz
          echo "dbb9265e3d70d72736bc53b1e2cecc0215c3a0162d0add718f7a0be48f5bfa1c  /tmp/phase5-product.tar.gz" | sha256sum -c -
          tar -tzf /tmp/phase5-product.tar.gz
          tar -xzf /tmp/phase5-product.tar.gz

      - name: Correct TanStack validated-search input typing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validated_routes = [
              Path("src/routes/app.support.tsx"),
              Path("src/routes/app.admin.vehicle-profiles.tsx"),
              Path("src/routes/app.admin.maintenance.tsx"),
              Path("src/routes/app.admin.driver-assignments.tsx"),
              Path("src/routes/app.admin.drivers.tsx"),
              Path("src/routes/app.admin.index.tsx"),
              Path("src/routes/app.admin.trip-history.tsx"),
              Path("src/routes/app.admin.support.tsx"),
              Path("src/routes/app.admin.trips.tsx"),
              Path("src/routes/app.admin.passengers.tsx"),
          ]

          for path in validated_routes:
              source = path.read_text()
              old_import = 'import { createFileRoute, Link, useNavigate } from "@tanstack/react-router";'
              new_import = 'import { createFileRoute, Link, useNavigate, type SearchSchemaInput } from "@tanstack/react-router";'
              if old_import in source:
                  source = source.replace(old_import, new_import, 1)
              elif new_import not in source:
                  raise RuntimeError(f"Unexpected router import in {path}")

              replacements = {
                  '(raw: Record<string, unknown>):': '(raw: Record<string, unknown> & SearchSchemaInput):',
                  '(search: Record<string, unknown>):': '(search: Record<string, unknown> & SearchSchemaInput):',
                  '(raw: Record<string, unknown>) =>': '(raw: Record<string, unknown> & SearchSchemaInput) =>',
                  '(search: Record<string, unknown>) =>': '(search: Record<string, unknown> & SearchSchemaInput) =>',
              }
              changed_signature = False
              for old, new in replacements.items():
                  if old in source:
                      source = source.replace(old, new, 1)
                      changed_signature = True
                      break
              if not changed_signature and "SearchSchemaInput" not in source.split("validateSearch:", 1)[1].split("\n", 2)[0]:
                  raise RuntimeError(f"Unexpected validateSearch signature in {path}")
              path.write_text(source)

          overview = Path("src/routes/app.admin.index.tsx")
          source = overview.read_text()
          source = source.replace(
              'const TRIPS_STATUS_FOR: Record<OverviewFilter, string> = {',
              'const TRIPS_STATUS_FOR = {',
              1,
          )
          marker = '};\n\ntype Ride ='
          replacement = '''} as const satisfies Record<OverviewFilter, FilterKey>;

          type FilterKey =
            | "all"
            | "scheduled"
            | "requested"
            | "accepted"
            | "driver_arriving"
            | "arrived"
            | "in_progress"
            | "completed"
            | "cancelled"
            | "pin_required";

          type DriverFilter =
            | "all"
            | "online"
            | "offline"
            | "assigned"
            | "available"
            | "stale"
            | "incomplete";

          type Ride ='''
          if marker not in source:
              raise RuntimeError("Overview type marker not found")
          source = source.replace(marker, replacement, 1)
          source = source.replace(
              'search={{ status: "all", q: "", from: "", to: "" }}',
              'search={{ status: "all", q: "", from: "", to: "", driver: "", vehicle: "", sort: "newest" }}',
              1,
          )
          source = source.replace('filterKey: string;', 'filterKey: DriverFilter;', 1)
          overview.write_text(source)

          trips = Path("src/routes/app.admin.trips.tsx")
          source = trips.read_text().replace(
              'search={{ status: "all", q: "", from: "", to: "" }}',
              'search={{ status: "all", q: "", from: "", to: "", driver: "", vehicle: "", sort: "newest" }}',
              1,
          )
          trips.write_text(source)

          driver = Path("src/routes/app.driver.tsx")
          source = driver.read_text()
          source = source.replace(
              'import { useEffect, useState } from "react";',
              'import { useCallback, useEffect, useState } from "react";',
              1,
          )
          source = source.replace('  const load = async () => {', '  const load = useCallback(async () => {', 1)
          source = source.replace('  };\n\n  useEffect(() => {\n    load();', '  }, [driverId]);\n\n  useEffect(() => {\n    load();', 1)
          source = source.replace('  }, [driverId]);\n\n  async function onStart', '  }, [driverId, load]);\n\n  async function onStart', 1)
          driver.write_text(source)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed source files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/components/AdminShell.tsx
            src/components/NotificationBell.tsx
            src/components/operations/OperationStatusBadge.tsx
            src/components/operations/DriverOperationsPanel.tsx
            src/components/operations/PassengerOperationsTimeline.tsx
            src/hooks/use-live-location.ts
            src/lib/operations.ts
            src/lib/operations.test.ts
            src/lib/phase5-migrations.test.ts
            src/routes/app.admin.dispatch.tsx
            src/routes/app.admin.live.tsx
            'src/routes/app.admin.operations.$runId.tsx'
            src/routes/app.admin.operations.tsx
            src/routes/app.admin.reliability.tsx
            src/routes/app.admin.schedule.tsx
            src/routes/app.driver.tsx
            src/routes/app.passenger.index.tsx
            src/routes/app.support.tsx
            src/routes/app.admin.vehicle-profiles.tsx
            src/routes/app.admin.maintenance.tsx
            src/routes/app.admin.driver-assignments.tsx
            src/routes/app.admin.drivers.tsx
            src/routes/app.admin.index.tsx
            src/routes/app.admin.trip-history.tsx
            src/routes/app.admin.support.tsx
            src/routes/app.admin.trips.tsx
            src/routes/app.admin.passengers.tsx
          )
          bunx prettier --write "${files[@]}"

      - name: Lint changed source files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/components/AdminShell.tsx
            src/components/NotificationBell.tsx
            src/components/operations/OperationStatusBadge.tsx
            src/components/operations/DriverOperationsPanel.tsx
            src/components/operations/PassengerOperationsTimeline.tsx
            src/hooks/use-live-location.ts
            src/lib/operations.ts
            src/lib/operations.test.ts
            src/lib/phase5-migrations.test.ts
            src/routes/app.admin.dispatch.tsx
            src/routes/app.admin.live.tsx
            'src/routes/app.admin.operations.$runId.tsx'
            src/routes/app.admin.operations.tsx
            src/routes/app.admin.reliability.tsx
            src/routes/app.admin.schedule.tsx
            src/routes/app.driver.tsx
            src/routes/app.passenger.index.tsx
            src/routes/app.support.tsx
            src/routes/app.admin.vehicle-profiles.tsx
            src/routes/app.admin.maintenance.tsx
            src/routes/app.admin.driver-assignments.tsx
            src/routes/app.admin.drivers.tsx
            src/routes/app.admin.index.tsx
            src/routes/app.admin.trip-history.tsx
            src/routes/app.admin.support.tsx
            src/routes/app.admin.trips.tsx
            src/routes/app.admin.passengers.tsx
          )
          bunx eslint "${files[@]}"

      - name: Run complete test suite
        run: bun run test

      - name: Run clean TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Run production build
        run: bun run build

      - name: Verify clean product boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260731130000_phase5_operations_foundation.sql
          test -f supabase/migrations/20260731131000_phase5_planning_dispatch.sql
          test -f supabase/migrations/20260731132000_phase5_reliability_scheduler.sql
          grep -q 'driver_update_location' src/hooks/use-live-location.ts
          grep -q 'DriverOperationsPanel' src/routes/app.driver.tsx
          grep -q 'PassengerOperationsTimeline' src/routes/app.passenger.index.tsx
          grep -q 'admin_publish_operation_plan' src/routes/app.admin.schedule.tsx
          grep -q 'driver_accept_dispatch_offer' src/components/operations/DriverOperationsPanel.tsx
          grep -q 'SearchSchemaInput' src/routes/app.admin.index.tsx
          git diff --check

      - name: Remove temporary transfer tooling
        run: |
          rm -rf .phase5-payload
          rm -f .github/workflows/phase5-apply-product.yml
          rm -f .github/workflows/phase5-source-export.yml

      - name: Commit verified Phase 5 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(operations): add service planning dispatch and reliability"
          git push origin HEAD:phase-5-operations-dispatch