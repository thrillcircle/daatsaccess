name: Phase 3 closeout verification

on:
  push:
    branches:
      - phase-3-fleet-consolidation

concurrency:
  group: phase-3-closeout
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  closeout-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-fleet-consolidation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply guarded closeout wiring
        run: python3 scripts/phase3_closeout_apply.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint closeout source
        run: |
          FILES=(
            'src/components/fleet/AdminEndVehicleAssignmentDialog.tsx'
            'src/components/fleet/AdminMaintenanceActions.tsx'
            'src/components/fleet/AdminVehicleRecordActions.tsx'
            'src/components/profile/DriverProfileSections.tsx'
            'src/routes/app.admin.driver-assignments.tsx'
            'src/routes/app.admin.maintenance.tsx'
            'src/routes/app.admin.vehicle-profiles.$vehicleId.tsx'
          )
          bunx prettier --write "${FILES[@]}"
          bunx eslint --fix "${FILES[@]}"
          bunx eslint "${FILES[@]}"

      - name: Run full test suite
        run: bun run test

      - name: Run production build
        run: bun run build

      - name: Commit verified closeout
        run: |
          rm -f scripts/phase3_closeout_apply.py .github/workflows/phase3-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(fleet): complete document and maintenance controls"
          git pull --rebase origin phase-3-fleet-consolidation
          git push origin HEAD:phase-3-fleet-consolidation
          gh pr comment 5 --body 'Phase 3 closeout controls committed. Protected vehicle editing, private document upload/replacement, restricted driver compliance reads, required maintenance completion details, future assignment scheduling and termination reasons passed scoped lint, full tests and the production build.'

      - name: Report failure
        if: failure()
        run: gh pr comment 5 --body 'Phase 3 closeout verification stopped before commit. No partial closeout commit was pushed.'
